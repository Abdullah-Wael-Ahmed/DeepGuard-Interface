server {
    listen 80;

    # 1. Serve the frontend files for standard requests
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Crucial for React/Vue routers to handle page refreshes correctly
        try_files $uri $uri/ /index.html; 
    }

    # 2. Proxy API requests to the backend container
    # (Assuming your Express routes start with /api)
    location /api/ {
        # THE TRAILING SLASH IS CRUCIAL HERE.
        # It translates http://localhost/api/auth -> http://backend:5000/auth
        # It translates ws://localhost/api -> ws://backend:5000/
        proxy_pass http://deepguard-backend:5000/; 
        
        # --- WebSocket Upgrade Magic ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # --- Standard Forwarding Headers ---
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://deepguard-backend:5000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Keep the connection alive for long-lived sockets
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}