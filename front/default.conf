server {
    listen 80;

    # 1. Serve the frontend files for standard requests
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Crucial for React/Vue routers to handle page refreshes correctly
        try_files $uri $uri/ /index.html; 
    }

    # 2. Proxy API requests to the backend container
    # (Assuming your Express routes start with /api)
    location /api/ {
        # 'deepguard-backend' is the exact container_name from docker-compose
        proxy_pass http://deepguard-backend:5000/; 
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}