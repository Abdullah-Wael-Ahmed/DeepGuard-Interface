version: "3.9"

services:
  backend:
    build: 
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: deepguard-backend-dev
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app             # Syncs local server code into the container
      - /app/node_modules         # PROTECTS the container's Linux modules
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # ← waits until MySQL is actually ready

  frontend:
    build: 
      context: ./front
      dockerfile: Dockerfile.dev
    container_name: deepguard-frontend-dev
    ports:
      - "3000:3000"               # Use 5173:5173 if using Vite
    volumes:
      - ./front:/app              # Syncs local frontend code into the container
      - /app/node_modules         # PROTECTS the container's Linux modules
    restart: unless-stopped
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: deepguard-mysql
    restart: unless-stopped
    env_file:
      - ./server/.env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data: