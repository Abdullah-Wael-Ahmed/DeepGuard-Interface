version: "3.9"

services:

  backend:
    build: ./server
    container_name: deepguard-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./logs/suricata:/app/logs/suricata:ro

  frontend:
    build: ./front
    container_name: deepguard-frontend
    ports:
      - "80:80"
    restart: unless-stopped 
    depends_on:
      - backend

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0 # Use the version matching your VM
    container_name: deepguard-filebeat
    user: root
    network_mode: "host" # Allows it to talk to Logstash on localhost easily
    volumes:
      - ./configs/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs/suricata:/var/log/suricata:ro # Ensure this path matches what's in your filebeat.yml
    command: ["--strict.perms=false"]
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: deepguard-logstash
    network_mode: "host"
    volumes:
      - ./configs/logstash/pipeline:/usr/share/logstash/pipeline:ro
    restart: unless-stopped

  suricata:
    image: jasonish/suricata:latest
    container_name: deepguard-suricata
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./logs/suricata:/var/log/suricata
      - ./suricata-config:/etc/suricata
    command: -c /etc/suricata/suricata.yaml -i ens33
    restart: unless-stopped

  zeek:
    image: zeek/zeek:8.1.0
    container_name: deepguard-zeek
    restart: unless-stopped
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      # Configuration files (your project-local copy)
      - ./configs/zeek:/usr/local/zeek/etc:ro
      # Logs → keep using your existing /opt/zeek/logs path
      # The container writes to its internal /usr/local/zeek/logs,
      # but Docker redirects everything to your real /opt/zeek/logs
      - /opt/zeek/logs:/usr/local/zeek/logs
    command: zeek -i ens33 local -C  # ← use this if your setup relies on zeekctl # If you do NOT use zeekctl (direct Zeek invocation), replace with:   
    # command: zeek -i ens33 local   # change ens33 to your actual interface name!
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
