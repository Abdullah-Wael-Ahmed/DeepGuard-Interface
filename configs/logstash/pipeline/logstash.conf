input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

filter {
  # =========================================================
  # 1. Suricata Logic (Alerts Only)
  # =========================================================
  if [engine] == "suricata" {
    if [event_type] != "alert" {
      drop { }
    }
    mutate {
      rename => { "src_ip"             => "[source][ip]" }
      rename => { "src_port"           => "[source][port]" }
      rename => { "dest_ip"            => "[destination][ip]" }
      rename => { "dest_port"          => "[destination][port]" }
      rename => { "[alert][signature]" => "signature" }
      rename => { "[alert][category]"  => "category" }
      rename => { "[alert][severity]"  => "severity" }
      rename => { "proto"              => "protocol" }
    }
  }

  # =========================================================
  # 2. Zeek Logic (Network Telemetry)
  # =========================================================
  else if [engine] == "zeek" {
    mutate {
      rename => { "id.orig_h" => "[source][ip]" }
      rename => { "id.orig_p" => "[source][port]" }
      rename => { "id.resp_h" => "[destination][ip]" }
      rename => { "id.resp_p" => "[destination][port]" }
      rename => { "proto"     => "protocol" }
      add_field => { "severity" => 0 }
    }

    # --- B. Connection Logs ---
    if [log_type] == "conn" {
      mutate {
        rename => { "service"    => "app_protocol" }
        rename => { "orig_bytes" => "bytes_sent" }
        rename => { "resp_bytes" => "bytes_received" }
        add_field => { "category" => "network_traffic" }
        rename => { "orig_pkts"     => "orig_pkts" }
        rename => { "resp_pkts"     => "resp_pkts" }
        rename => { "orig_ip_bytes" => "orig_ip_bytes" }
        rename => { "resp_ip_bytes" => "resp_ip_bytes" }
      }

      # --- Map Zeek fields to anomaly detector features ---
      mutate {
        add_field => {
          "Flow Duration"               => "%{duration}"
          "Total Fwd Packets"           => "0"
          "Total Backward Packets"      => "0"
          "Total Length of Fwd Packets" => "%{bytes_sent}"
          "Total Length of Bwd Packets" => "%{bytes_received}"
          "Fwd Packet Length Max"       => "0"
          "Bwd Packet Length Max"       => "0"
          "Flow Bytes/s"                => "0"
          "Flow Packets/s"              => "0"
          "Flow IAT Mean"               => "0"
          "Destination Port"            => "%{[destination][port]}"
          "src_ip"                      => "%{[source][ip]}"
        }
      }

      # Convert string fields to float for the anomaly detector
      mutate {
        convert => {
          "Flow Duration"               => "float"
          "Total Fwd Packets"           => "float"
          "Total Backward Packets"      => "float"
          "Total Length of Fwd Packets" => "float"
          "Total Length of Bwd Packets" => "float"
          "Fwd Packet Length Max"       => "float"
          "Bwd Packet Length Max"       => "float"
          "Flow Bytes/s"                => "float"
          "Flow Packets/s"              => "float"
          "Flow IAT Mean"               => "float"
          "Destination Port"            => "float"
        }
      }
    }

    # --- C. DNS Logs ---
    else if [log_type] == "dns" {
      mutate {
        rename => { "query"      => "dns_query" }
        rename => { "qtype_name" => "dns_qtype" }
        rename => { "rcode_name" => "dns_rcode" }
        rename => { "answers"    => "dns_answers" }
        add_field => { "category" => "dns_query" }
        replace  => { "protocol" => "dns" }
      }
    }
  }

  # =========================================================
  # 3. Prune — keep only needed fields
  # =========================================================
  prune {
    whitelist_names => [
      "^source$", "^destination$",
      "signature", "category", "severity",
      "engine", "@timestamp", "protocol", "log_type",
      "dns_query", "dns_qtype", "dns_answers",
      "duration", "bytes_sent", "bytes_received",
      "uid", "conn_state", "app_protocol",
      "orig_pkts", "resp_pkts", "orig_ip_bytes", "resp_ip_bytes",
      "src_ip",
      "Flow Duration",
      "Total Fwd Packets",
      "Total Backward Packets",
      "Total Length of Fwd Packets",
      "Total Length of Bwd Packets",
      "Fwd Packet Length Max",
      "Bwd Packet Length Max",
      "Flow Bytes/s",
      "Flow Packets/s",
      "Flow IAT Mean",
      "Destination Port"
    ]
  }
}

output {
  # =========================================================
  # 1. Suricata alerts → backend
  # =========================================================
  if [engine] == "suricata" {
    http {
      url              => "http://deepguard-backend/logs/filebeat"
      http_method      => "post"
      format           => "json"
      pool_max         => 1
      pool_max_per_route => 1
      automatic_retries => 0
    }
  }

  # =========================================================
  # 2. Zeek logs → backend + anomaly detector (conn only)
  # =========================================================
  else if [engine] == "zeek" {
    # Always send to backend
    http {
      url              => "http://deepguard-backend/zeek/ingest/%{log_type}"
      http_method      => "post"
      format           => "json"
      pool_max         => 1
      pool_max_per_route => 1
      automatic_retries => 0
    }

    # Also send conn logs to anomaly detector
    if [log_type] == "conn" {
      http {
        url              => "http://deepguard-anomaly:5001/analyze"
        http_method      => "post"
        format           => "json"
       # pool_max         => 2
       # pool_max_per_route => 1
       # automatic_retries => 0
      }
    }
  }
}
