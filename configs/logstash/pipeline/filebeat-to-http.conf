input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

filter {
  # Only keep Suricata alerts
  if [engine] == "suricata" {
    if [event_type] != "alert" {
      drop { }
    }
    mutate {
      rename => { "src_ip"   => "[source][ip]" }
      rename => { "src_port" => "[source][port]" }
      rename => { "dest_ip"  => "[destination][ip]" }
      rename => { "dest_port"=> "[destination][port]" }
      rename => { "[alert][signature]" => "signature" }
      rename => { "[alert][category]"  => "category" }
      rename => { "[alert][severity]"  => "severity" }
      rename => { "proto"      => "protocol" }
    }
  }

  # =========================================================
  # 2. Zeek Logic (Network Telemetry)
  # =========================================================
  else if [engine] == "zeek" {
    
    # --- A. Common Fields for ALL Zeek logs ---
    # Both DNS and Conn logs use 'id.orig_h' for Source IP in standard Zeek JSON
    mutate {
      rename => { "id.orig_h"  => "[source][ip]" }
      rename => { "id.orig_p"  => "[source][port]" }
      rename => { "id.resp_h"  => "[destination][ip]" }
      rename => { "id.resp_p"  => "[destination][port]" }
      rename => { "proto"      => "protocol" }
      # Add default values if missing
      add_field => { "severity" => 0 } 
    }

    # --- B. Specific Logic: Connection Logs ---
    if [log_type] == "conn" {
      mutate {
        rename => { "service"    => "app_protocol" }
        rename => { "duration"   => "duration" }
        rename => { "orig_bytes" => "bytes_sent" }
        rename => { "resp_bytes" => "bytes_received" }
        add_field => { "category" => "network_traffic" }
      }
    }

    # --- C. Specific Logic: DNS Logs ---
    else if [log_type] == "dns" {
      mutate {
        rename => { "query"      => "dns_query" }
        rename => { "qtype_name" => "dns_qtype" }
        rename => { "rcode_name" => "dns_rcode" }
        rename => { "answers"    => "dns_answers" }
        add_field => { "category" => "dns_query" }
        # DNS is usually UDP/TCP but let's ensure protocol is clear
        replace => { "protocol" => "dns" } 
      }
    }
  }

  # Drop everything except these fields
prune {
    whitelist_names => [
      "^source$", "^destination$", "signature", "category", "severity", 
      "engine", "@timestamp", "protocol", "log_type", 
      "dns_query", "dns_qtype", "dns_answers", "duration", "bytes_sent", "bytes_received", "uid", "conn_state"
    ]
  }
}


output {
  if [engine] == "suricata"{
      http {
        url => "http://deepguard-backend/logs/filebeat"
        http_method => "post"
        format => "json"
        pool_max => 1
        pool_max_per_route => 1
        automatic_retries => 0
      }
  }
  else if [engine] == "zeek"{
    http {
      url => "http://deepguard-backend/zeek/ingest/%{log_type}" # New endpoint
      http_method => "post"
      format => "json"
      pool_max => 1
      pool_max_per_route => 1
      automatic_retries => 0
    }
  }
}
